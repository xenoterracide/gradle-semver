name: build
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_call:
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v6.0.2
      - &java
        uses: actions/setup-java@v5.2.0
        with:
          distribution: temurin
          java-version: 25
      - &gradle
        uses: gradle/actions/setup-gradle@v5.0.2
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - run: ./gradlew version build --console=plain
        env:
          ORG_GRADLE_PROJECT_ghUsername: ${{ github.actor }}
          ORG_GRADLE_PROJECT_ghPassword: ${{ github.token }}
      - uses: gradle/actions/dependency-submission@v5.0.2
        if: ${{ github.ref_name == 'develop' }}
        env:
          ORG_GRADLE_PROJECT_ghUsername: ${{ github.actor }}
          ORG_GRADLE_PROJECT_ghPassword: ${{ github.token }}

  full:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v6.0.2
      - *java
      - *gradle
      - run: ./gradlew build --console=plain --no-build-cache --no-configuration-cache --rerun-tasks
        env:
          ORG_GRADLE_PROJECT_ghUsername: ${{ github.actor }}
          ORG_GRADLE_PROJECT_ghPassword: ${{ github.token }}

  publish:
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
      packages: write
    concurrency:
      group: publish
    env:
      IS_PUBLISHING: true
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.ref_name }}
          filter: "blob:none"
          fetch-depth: 0
          fetch-tags: true
      - run: git remote set-head --auto origin
      - *java
      - *gradle
      - run: ./gradlew version --quiet
        env:
          ORG_GRADLE_PROJECT_ghUsername: ${{ github.actor }}
          ORG_GRADLE_PROJECT_ghPassword: ${{ github.token }}
      - run: ./gradlew publishAllPublicationsToStagingRepository
        env:
          ORG_GRADLE_PROJECT_ghUsername: ${{ github.actor }}
          ORG_GRADLE_PROJECT_ghPassword: ${{ github.token }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_SECRET_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSPHRASE }}
      - name: detect tag
        id: detect-tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "is_tag=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_tag=false" >> "$GITHUB_OUTPUT"
          fi
      - run: ./gradlew publishPlugins --validate-only --no-configuration-cache --info
        if: ${{ steps.detect-tag.outputs.is_tag == 'true' }}
        env:
          ORG_GRADLE_PROJECT_ghUsername: ${{ github.actor }}
          ORG_GRADLE_PROJECT_ghPassword: ${{ github.token }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_SECRET_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSPHRASE }}
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
      - run: ./gradlew publishAllPublicationsToGhRepository --info
        env:
          ORG_GRADLE_PROJECT_ghUsername: ${{ github.actor }}
          ORG_GRADLE_PROJECT_ghPassword: ${{ github.token }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_SECRET_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSPHRASE }}
      - name: create release archives
        id: archives
        if: ${{ steps.detect-tag.outputs.is_tag == 'true' }}
        run: |
          mkdir -p release-archives
          for module_dir in ./module/*/build/repo; do
            # Extract module name: ./module/<name>/build/repo -> <name>
            module_name=$(basename "$(dirname "$(dirname "$module_dir")")")
            # Create tar.gz with complete Maven repository structure
            # Includes: artifacts, signatures (.asc), checksums, and maven-metadata.xml
            tar -czf "release-archives/${module_name}-${GITHUB_REF_NAME}.tar.gz" \
              -C "$(dirname "$module_dir")" \
              "$(basename "$module_dir")"
          done
          ls -la release-archives/
      - run: gh release create "${GITHUB_REF_NAME}" --generate-notes --verify-tag release-archives/*.tar.gz
        if: ${{ steps.detect-tag.outputs.is_tag == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
      - run: ./gradlew publishPlugins --no-configuration-cache --info
        if: ${{ steps.detect-tag.outputs.is_tag == 'true' }}
        env:
          ORG_GRADLE_PROJECT_ghUsername: ${{ github.actor }}
          ORG_GRADLE_PROJECT_ghPassword: ${{ github.token }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_SECRET_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSPHRASE }}
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
